# Tools/UiGate/judge.conf — read by Tools/pf/visual-judge.sh (KEY=value, last one wins).
#
# SKU-OWNED (emitted once by the Setup Wizard's test kit).
#
# The judge runs `codex exec --ignore-user-config` so this repo's own agent hooks never reach it.
# That flag also drops ~/.codex/config.toml, so without a pin here the judge silently runs the
# Codex CLI's built-in default model at its default effort — and a catch rate measured on one model
# says nothing about another. Change a value here => re-run Tools/pf/judge-calibrate.py; a new model
# has no calibration until you do.
#
# Precedence: --model/--effort flag > VISUAL_JUDGE_MODEL/VISUAL_JUDGE_EFFORT env > this file.

VISUAL_JUDGE_MODEL=gpt-6-astra
VISUAL_JUDGE_EFFORT=high

# The implement -> capture -> judge loop. The judge prints `LOOP: … continue | stop (…) | done` after
# every verdict and the agents follow it, so this is the ONE place the round budget lives.
#   fixed     stop after UIGATE_LOOP_MAX_ROUNDS rounds per caller (stage / audit)
#   progress  continue while each round leaves fewer rows VIOLATED; stop at the first
#             round that does not, or at the ceiling
# A single row stuck on unchanged pixels still HALTs (exit 3) under either policy.
UIGATE_LOOP_POLICY=fixed
UIGATE_LOOP_MAX_ROUNDS=3

# A row's verdict counts only when this many independent calls AGREE. The judge makes that many calls
# in parallel, then one more at a time for any row they split, up to 2K-1. A row that never reaches K
# is VIOLATED, marked `unsettled`. Why 2: measured on a SKU, a byte-identical input judged
# all-SATISFIED in the morning came back three rows VIOLATED in 3 of 3 re-runs that evening. One call,
# replayed by the cache, is how a borderline row gets signed off by luck. Cost at the JPEG default:
# about 75 s of wall time per judge run, and 2-3x the judge tokens of a single call.
UIGATE_JUDGE_SAMPLES=2
